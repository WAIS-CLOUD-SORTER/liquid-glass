<svg xmlns="http://www.w3.org/2000/svg" width="100" height="100" viewBox="0 0 100 100" preserveAspectRatio="none">
  <!--
    Displacement map for feDisplacementMap.
    R channel = horizontal shift, G channel = vertical shift, 0x80 (128) = neutral.
    Layer 1 carries G only (R,B = 0), layer 2 carries R only (G,B = 0); with
    mix-blend-mode: lighten the result is the per-channel max, so both survive.
    Neutral through the middle, ramping toward the borders = edge lensing.
    Ramp shape is what you tune: steeper stops = harder lens.
  -->
  <defs>
    <linearGradient id="gy" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0"    stop-color="#003000"/>
      <stop offset="0.045" stop-color="#006000"/>
      <stop offset="0.14" stop-color="#008000"/>
      <stop offset="0.86" stop-color="#008000"/>
      <stop offset="0.955" stop-color="#00a000"/>
      <stop offset="1"    stop-color="#00d000"/>
    </linearGradient>
    <linearGradient id="gx" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0"    stop-color="#300000"/>
      <stop offset="0.045" stop-color="#600000"/>
      <stop offset="0.14" stop-color="#800000"/>
      <stop offset="0.86" stop-color="#800000"/>
      <stop offset="0.955" stop-color="#a00000"/>
      <stop offset="1"    stop-color="#d00000"/>
    </linearGradient>
  </defs>
  <rect width="100" height="100" fill="url(#gy)"/>
  <rect width="100" height="100" fill="url(#gx)" style="mix-blend-mode: lighten"/>
</svg>
